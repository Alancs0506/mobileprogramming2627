name: Cek Struktur File dan Widget UTS

on: 
    push:
        branches:
        - soal_uts
    pull_request:
        branches:
        - soal_uts


jobs:
  cek-struktur-dan-widget:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Cek Keberadaan File
        run: |
          echo "Mengecek struktur file di UTS/lib/..."
          
          # Cek file main.dart
          if [ ! -f "UTS/lib/main.dart" ]; then 
            echo "❌ File main.dart tidak ditemukan!"
            exit 1
          fi
          
          # Cek file credit_cards_page.dart
          if [ ! -f "UTS/lib/credit_cards_page.dart" ]; then 
            echo "❌ File credit_cards_page.dart tidak ditemukan!"
            exit 1
          fi
          
          # Cek file Baca_petunjuk.md
          if [ ! -f "UTS/lib/Baca_petunjuk.md" ]; then 
            echo "❌ File Baca_petunjuk.md tidak ditemukan!"
            exit 1
          fi
          
          echo "✅ Semua file wajib ditemukan."

      - name: Cek Penggunaan Widget di main.dart
        run: |
          echo "Mengecek widget di main.dart..."
          
          grep -q "MaterialApp" UTS/lib/main.dart || { echo "❌ Widget MaterialApp tidak ditemukan di main.dart"; exit 1; }
          grep -q "Scaffold" UTS/lib/main.dart || { echo "❌ Widget Scaffold tidak ditemukan di main.dart"; exit 1; }
          grep -q "SafeArea" UTS/lib/main.dart || { echo "❌ Widget SafeArea tidak ditemukan di main.dart"; exit 1; }
          grep -q "CreditCardsPage" UTS/lib/main.dart || { echo "❌ Class CreditCardsPage tidak dipanggil di main.dart"; exit 1; }
          
          echo "✅ Pengecekan main.dart selesai."

      - name: Cek Penggunaan Widget di credit_cards_page.dart
        run: |
          echo "Mengecek widget di credit_cards_page.dart..."
          
          grep -q "SingleChildScrollView" UTS/lib/credit_cards_page.dart || { echo "❌ Widget SingleChildScrollView tidak ditemukan!"; exit 1; }
          grep -q "Card" UTS/lib/credit_cards_page.dart || { echo "❌ Widget Card tidak ditemukan!"; exit 1; }
          grep -q "FloatingActionButton" UTS/lib/credit_cards_page.dart || { echo "❌ Widget FloatingActionButton tidak ditemukan!"; exit 1; }
          grep -q "Column" UTS/lib/credit_cards_page.dart || { echo "❌ Widget Column tidak ditemukan!"; exit 1; }
          
          echo "✅ Pengecekan credit_cards_page.dart selesai."
      - name: CSingleChildScrollView
        run: |
          FILE="UTS/lib/credit_cards_page.dart"
          
          # 1. Pastikan file ada
          if [ ! -f "$FILE" ]; then
            echo "❌ File $FILE tidak ditemukan!"
            exit 1
          fi
          
          echo "Mengecek hierarki widget utama..."
          grep -q "SingleChildScrollView" "$FILE" || { echo "❌ Widget SingleChildScrollView tidak ditemukan!"; exit 1; }
          grep -q "Container" "$FILE" || { echo "❌ Widget Container tidak ditemukan di dalam struktur utama!"; exit 1; }
          grep -q "Column" "$FILE" || { echo "❌ Widget Column tidak ditemukan!"; exit 1; }
          
          echo "Mengecek pemanggilan custom method..."
          grep -q "_buildTitleSection" "$FILE" || { echo "❌ Method _buildTitleSection() tidak dipanggil!"; exit 1; }
          grep -q "_buildCreditCard" "$FILE" || { echo "❌ Method _buildCreditCard() tidak dipanggil!"; exit 1; }
          grep -q "_buildAddCardButton" "$FILE" || { echo "❌ Method _buildAddCardButton() tidak dipanggil!"; exit 1; }
          grep -q "SizedBox" "$FILE" || { echo "❌ Widget SizedBox sebagai pemisah tidak ditemukan!"; exit 1; }

          echo "Mengecek penggunaan variabel parameter..."
          grep -q "warnaKartu1" "$FILE" || { echo "❌ Parameter warnaKartu1 tidak diteruskan ke _buildCreditCard!"; exit 1; }
          grep -q "warnaKartu2" "$FILE" || { echo "❌ Parameter warnaKartu2 tidak diteruskan ke _buildCreditCard!"; exit 1; }
          grep -q "namaMahasiswa" "$FILE" || { echo "❌ Parameter namaMahasiswa tidak digunakan!"; exit 1; }
          grep -q "nimMahasiswa" "$FILE" || { echo "❌ Parameter nimMahasiswa tidak digunakan!"; exit 1; }
          
          echo "✅ Selamat! Semua struktur widget dan pemanggilan method sesuai."
        
      - name: Cek Implementasi _buildTitleSection
        run: |
            FILE="UTS/lib/credit_cards_page.dart"
            
            echo "Mengecek definisi parameter _buildTitleSection..."
            grep -q "Column _buildTitleSection" "$FILE" || { echo "❌ Method _buildTitleSection tidak mengembalikan Column!"; exit 1; }
            grep -q "required String title" "$FILE" || { echo "❌ Parameter 'title' tidak ditemukan atau tidak required!"; exit 1; }
            grep -q "required String subTitle" "$FILE" || { echo "❌ Parameter 'subTitle' tidak ditemukan atau tidak required!"; exit 1; }
            
            echo "Mengecek properti dan styling..."
            grep -q "crossAxisAlignment: CrossAxisAlignment.start" "$FILE" || { echo "❌ CrossAxisAlignment.start tidak ditemukan!"; exit 1; }
            grep -q "fontSize: 30" "$FILE" || { echo "❌ Ukuran font 30 untuk title tidak ditemukan!"; exit 1; }
            grep -q "fontWeight: FontWeight.bold" "$FILE" || { echo "❌ FontWeight.bold untuk title tidak ditemukan!"; exit 1; }
            grep -q "fontSize: 21" "$FILE" || { echo "❌ Ukuran font 21 untuk subTitle tidak ditemukan!"; exit 1; }
            grep -q "color: Colors.black45" "$FILE" || { echo "❌ Warna Colors.black45 untuk subTitle tidak ditemukan!"; exit 1; }
            
            echo "✅ Implementasi _buildTitleSection sudah sesuai."
    
      - name: Cek Implementasi _buildCreditCard
        run: |
          FILE="UTS/lib/credit_cards_page.dart"
          
          echo "Mengecek definisi parameter _buildCreditCard..."
          grep -q "Card _buildCreditCard" "$FILE" || { echo "❌ Method _buildCreditCard tidak mengembalikan Card!"; exit 1; }
          grep -q "required Color color" "$FILE" || { echo "❌ Parameter 'color' tidak ditemukan atau tidak required!"; exit 1; }
          grep -q "required String cardNumber" "$FILE" || { echo "❌ Parameter 'cardNumber' tidak ditemukan atau tidak required!"; exit 1; }
          grep -q "required String cardHolder" "$FILE" || { echo "❌ Parameter 'cardHolder' tidak ditemukan atau tidak required!"; exit 1; }
          grep -q "required String cardExpiration" "$FILE" || { echo "❌ Parameter 'cardExpiration' tidak ditemukan atau tidak required!"; exit 1; }
          
          echo "Mengecek properti desain Card dan Container..."
          grep -q "elevation: 4.0" "$FILE" || { echo "❌ elevation: 4.0 tidak ditemukan!"; exit 1; }
          grep -q "BorderRadius.circular(14)" "$FILE" || { echo "❌ BorderRadius.circular(14) tidak ditemukan!"; exit 1; }
          grep -q "height: 200" "$FILE" || { echo "❌ height: 200 pada Container tidak ditemukan!"; exit 1; }
          
          echo "Mengecek styling teks dan pemanggilan block lain..."
          grep -q "fontFamily: 'CourrierPrime'" "$FILE" || { echo "❌ fontFamily 'CourrierPrime' tidak ditemukan!"; exit 1; }
          grep -q "_buildLogosBlock()" "$FILE" || { echo "❌ Method _buildLogosBlock() tidak dipanggil di dalam Card!"; exit 1; }
          grep -q "_buildDetailsBlock" "$FILE" || { echo "❌ Method _buildDetailsBlock() tidak dipanggil!"; exit 1; }
          
          echo "✅ Implementasi _buildCreditCard sudah sesuai."
      - name: Cek Implementasi _buildLogosBlock
        run: |
          FILE="UTS/lib/credit_cards_page.dart"
          
          echo "Mengecek definisi _buildLogosBlock..."
          grep -q "Row _buildLogosBlock" "$FILE" || { echo "❌ Method _buildLogosBlock tidak mengembalikan Row!"; exit 1; }
          grep -q "mainAxisAlignment: MainAxisAlignment.spaceBetween" "$FILE" || { echo "❌ MainAxisAlignment.spaceBetween tidak ditemukan di _buildLogosBlock!"; exit 1; }
          
          echo "Mengecek penggunaan aset gambar..."
          grep -q "assets/images/contact_less.png" "$FILE" || { echo "❌ Gambar contact_less.png tidak dipanggil!"; exit 1; }
          grep -q "assets/images/mastercard.png" "$FILE" || { echo "❌ Gambar mastercard.png tidak dipanggil!"; exit 1; }
          
          echo "Mengecek dimensi gambar..."
          grep -q "height: 20" "$FILE" || { echo "❌ Height 20 untuk contact_less tidak ditemukan!"; exit 1; }
          grep -q "width: 18" "$FILE" || { echo "❌ Width 18 untuk contact_less tidak ditemukan!"; exit 1; }
          grep -q "height: 50" "$FILE" || { echo "❌ Height 50 untuk mastercard tidak ditemukan!"; exit 1; }
          grep -q "width: 50" "$FILE" || { echo "❌ Width 50 untuk mastercard tidak ditemukan!"; exit 1; }
          
          echo "✅ Implementasi _buildLogosBlock sudah sesuai."
      - name: Cek Implementasi _buildDetailsBlock
        run: |
          FILE="UTS/lib/credit_cards_page.dart"
          
          echo "Mengecek definisi parameter _buildDetailsBlock..."
          grep -q "Column _buildDetailsBlock" "$FILE" || { echo "❌ Method _buildDetailsBlock tidak mengembalikan Column!"; exit 1; }
          grep -q "required String label" "$FILE" || { echo "❌ Parameter 'label' tidak ditemukan atau tidak required!"; exit 1; }
          grep -q "required String value" "$FILE" || { echo "❌ Parameter 'value' tidak ditemukan atau tidak required!"; exit 1; }
          
          echo "Mengecek alignment dan styling teks..."
          grep -q "crossAxisAlignment: CrossAxisAlignment.start" "$FILE" || { echo "❌ CrossAxisAlignment.start pada _buildDetailsBlock tidak ditemukan!"; exit 1; }
          grep -q "color: Colors.grey" "$FILE" || { echo "❌ Warna Colors.grey untuk label tidak ditemukan!"; exit 1; }
          grep -q "fontSize: 9" "$FILE" || { echo "❌ Ukuran font 9 untuk label tidak ditemukan!"; exit 1; }
          grep -q "color: Colors.white" "$FILE" || { echo "❌ Warna Colors.white untuk value tidak ditemukan!"; exit 1; }
          grep -q "fontSize: 15" "$FILE" || { echo "❌ Ukuran font 15 untuk value tidak ditemukan!"; exit 1; }
          grep -q "fontWeight: FontWeight.bold" "$FILE" || { echo "❌ FontWeight.bold tidak ditemukan pada _buildDetailsBlock!"; exit 1; }
          
          echo "✅ Implementasi _buildDetailsBlock sudah sesuai."
      - name: Cek Implementasi _buildAddCardButton
        run: |
          FILE="UTS/lib/credit_cards_page.dart"
          
          echo "Mengecek definisi parameter _buildAddCardButton..."
          grep -q "Container _buildAddCardButton" "$FILE" || { echo "❌ Method _buildAddCardButton tidak mengembalikan Container!"; exit 1; }
          grep -q "required Icon icon" "$FILE" || { echo "❌ Parameter 'icon' tidak ditemukan atau tidak required!"; exit 1; }
          grep -q "required Color color" "$FILE" || { echo "❌ Parameter 'color' tidak ditemukan atau tidak required!"; exit 1; }
          
          echo "Mengecek layout Container..."
          grep -q "EdgeInsets.only(top: 24.0)" "$FILE" || { echo "❌ Margin top 24.0 tidak ditemukan!"; exit 1; }
          grep -q "alignment: Alignment.center" "$FILE" || { echo "❌ alignment: Alignment.center tidak ditemukan!"; exit 1; }
          
          echo "Mengecek properti FloatingActionButton..."
          grep -q "FloatingActionButton" "$FILE" || { echo "❌ Widget FloatingActionButton tidak ditemukan!"; exit 1; }
          grep -q "elevation: 2.0" "$FILE" || { echo "❌ elevation: 2.0 tidak ditemukan!"; exit 1; }
          grep -q "backgroundColor: color" "$FILE" || { echo "❌ backgroundColor tidak menggunakan parameter color!"; exit 1; }
          grep -q "mini: false" "$FILE" || { echo "❌ Properti mini: false tidak ditemukan!"; exit 1; }
          
          echo "✅ Implementasi _buildAddCardButton sudah sesuai."
        
     